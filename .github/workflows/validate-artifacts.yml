name: Validate source artifacts
on:
  push:
    branches: [master]
    paths: ['docs/**', 'diagrams/**', 'tools/**', '.github/workflows/validate-artifacts.yml']
  pull_request:
    paths: ['docs/**', 'diagrams/**', 'tools/**', '.github/workflows/validate-artifacts.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/validate_project.py
